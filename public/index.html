<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>Controle Financeiro Pessoal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; color: #1a1a2e; }
    header { background: #1a1a2e; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; }
    #user-info { font-size: 0.85rem; opacity: 0.8; }
    #btn-logout { background: #e63946; color: #fff; border: none; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }

    /* Auth */
    #auth-section { display: flex; gap: 1.5rem; justify-content: center; margin-top: 4rem; }
    .card { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); min-width: 300px; }
    .card h2 { margin-bottom: 1.2rem; font-size: 1.1rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }

    /* App */
    #app-section { display: none; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab { padding: 0.5rem 1.1rem; border-radius: 8px; border: 2px solid #e2e8f0; background: #fff; cursor: pointer; font-size: 0.9rem; transition: all 0.15s; }
    .tab.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* Forms */
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem; margin-top: 0.8rem; color: #555; }
    input, select { width: 100%; padding: 0.55rem 0.75rem; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 0.9rem; }
    input:focus, select:focus { outline: none; border-color: #1a1a2e; }
    .row { display: flex; gap: 0.75rem; }
    .row > * { flex: 1; }
    button[type=submit], .btn { margin-top: 1.2rem; width: 100%; padding: 0.65rem; background: #1a1a2e; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer; transition: opacity 0.15s; }
    button[type=submit]:hover, .btn:hover { opacity: 0.85; }
    .btn-sm { margin-top: 0; width: auto; padding: 0.35rem 0.85rem; font-size: 0.82rem; border-radius: 6px; }
    .btn-green { background: #2d6a4f; }
    .msg { margin-top: 0.75rem; font-size: 0.85rem; padding: 0.5rem 0.75rem; border-radius: 6px; }
    .msg.error { background: #fee2e2; color: #991b1b; }
    .msg.success { background: #d1fae5; color: #065f46; }

    /* Grid layout */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }

    /* Table */
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { background: #f8fafc; padding: 0.6rem 0.75rem; text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; border-bottom: 2px solid #e2e8f0; }
    td { padding: 0.6rem 0.75rem; border-bottom: 1px solid #f1f5f9; }
    tr:hover td { background: #f8fafc; }
    .badge { display: inline-block; padding: 0.2rem 0.55rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge-income { background: #d1fae5; color: #065f46; }
    .badge-expense { background: #fee2e2; color: #991b1b; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-paid { background: #dbeafe; color: #1e40af; }

    /* Reports */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: #fff; border-radius: 12px; padding: 1.2rem 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-label { font-size: 0.78rem; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 1.6rem; font-weight: 700; margin-top: 0.3rem; }
    .stat-income { color: #059669; }
    .stat-expense { color: #dc2626; }
    .stat-balance { color: #1a1a2e; }
  </style>
</head>
<body>

<header>
  <h1>💰 Controle Financeiro Pessoal</h1>
  <div style="display:flex;align-items:center;gap:1rem">
    <span id="user-info"></span>
    <button id="btn-logout" style="display:none" onclick="logout()">Sair</button>
  </div>
</header>

<!-- AUTH -->
<div id="auth-section">
  <div class="card">
    <h2>Entrar</h2>
    <form id="form-login">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="seu@email.com" required />
      <label>Senha</label>
      <input type="password" id="login-password" placeholder="••••••••" required />
      <button type="submit">Entrar</button>
      <div id="msg-login" class="msg" style="display:none"></div>
    </form>
  </div>
  <div class="card">
    <h2>Criar conta</h2>
    <form id="form-register">
      <label>Nome</label>
      <input type="text" id="reg-name" placeholder="Seu nome" required />
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="seu@email.com" required />
      <label>Senha</label>
      <input type="password" id="reg-password" placeholder="••••••••" required />
      <button type="submit">Criar conta</button>
      <div id="msg-register" class="msg" style="display:none"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app-section">
  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="showTab('categories')">Categorias</button>
      <button class="tab" onclick="showTab('transactions')">Lançamentos</button>
      <button class="tab" onclick="showTab('reports')">Relatórios</button>
    </div>

    <!-- CATEGORIAS -->
    <div id="panel-categories" class="panel active">
      <div class="two-col">
        <div class="card">
          <h2>Nova Categoria</h2>
          <form id="form-category">
            <label>Nome</label>
            <input type="text" id="cat-name" placeholder="Ex: Alimentação" required />
            <label>Tipo</label>
            <select id="cat-kind">
              <option value="expense">Despesa</option>
              <option value="income">Receita</option>
            </select>
            <button type="submit">Adicionar</button>
            <div id="msg-category" class="msg" style="display:none"></div>
          </form>
        </div>
        <div class="card">
          <h2>Minhas Categorias</h2>
          <table id="table-categories">
            <thead><tr><th>Nome</th><th>Tipo</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- LANÇAMENTOS -->
    <div id="panel-transactions" class="panel">
      <div class="two-col">
        <div class="card">
          <h2>Novo Lançamento</h2>
          <form id="form-transaction">
            <label>Descrição</label>
            <input type="text" id="tx-description" placeholder="Ex: Conta de luz" required />
            <div class="row">
              <div>
                <label>Valor (R$)</label>
                <input type="number" id="tx-amount" placeholder="0.00" step="0.01" min="0.01" required />
              </div>
              <div>
                <label>Tipo</label>
                <select id="tx-type" onchange="loadCategoriesForSelect()">
                  <option value="expense">Despesa</option>
                  <option value="income">Receita</option>
                </select>
              </div>
            </div>
            <label>Categoria</label>
            <select id="tx-category" required></select>
            <label>Data</label>
            <input type="datetime-local" id="tx-date" required />
            <button type="submit">Registrar</button>
            <div id="msg-transaction" class="msg" style="display:none"></div>
          </form>
        </div>
        <div class="card">
          <h2>Filtros</h2>
          <div class="row">
            <div>
              <label>Mês</label>
              <select id="filter-month">
                <option value="">Todos</option>
                <option value="1">Janeiro</option><option value="2">Fevereiro</option>
                <option value="3">Março</option><option value="4">Abril</option>
                <option value="5">Maio</option><option value="6">Junho</option>
                <option value="7">Julho</option><option value="8">Agosto</option>
                <option value="9">Setembro</option><option value="10">Outubro</option>
                <option value="11">Novembro</option><option value="12">Dezembro</option>
              </select>
            </div>
            <div>
              <label>Ano</label>
              <input type="number" id="filter-year" placeholder="2026" value="2026" />
            </div>
          </div>
          <label>Categoria</label>
          <select id="filter-category">
            <option value="">Todas</option>
          </select>
          <button class="btn" onclick="loadTransactions()">Filtrar</button>
        </div>
      </div>
      <div class="card" style="margin-top:1.5rem">
        <h2>Lançamentos</h2>
        <table id="table-transactions">
          <thead>
            <tr>
              <th>Descrição</th><th>Tipo</th><th>Valor</th>
              <th>Categoria</th><th>Data</th><th>Status</th><th>Ação</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- RELATÓRIOS -->
    <div id="panel-reports" class="panel">
      <div class="card" style="margin-bottom:1.5rem">
        <div class="row" style="align-items:flex-end;gap:1rem">
          <div>
            <label>Mês</label>
            <select id="report-month">
              <option value="1">Janeiro</option><option value="2">Fevereiro</option>
              <option value="3">Março</option><option value="4">Abril</option>
              <option value="5">Maio</option><option value="6">Junho</option>
              <option value="7">Julho</option><option value="8">Agosto</option>
              <option value="9">Setembro</option><option value="10">Outubro</option>
              <option value="11">Novembro</option><option value="12">Dezembro</option>
            </select>
          </div>
          <div>
            <label>Ano</label>
            <input type="number" id="report-year" value="2026" />
          </div>
          <div style="flex:0">
            <button class="btn" style="width:auto;padding:0.55rem 1.2rem" onclick="loadReports()">Gerar</button>
          </div>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Receitas</div>
          <div class="stat-value stat-income" id="stat-income">R$ —</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Despesas</div>
          <div class="stat-value stat-expense" id="stat-expense">R$ —</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Saldo</div>
          <div class="stat-value stat-balance" id="stat-balance">R$ —</div>
        </div>
      </div>

      <div class="card">
        <h2>Resumo por Categoria</h2>
        <table id="table-summary">
          <thead><tr><th>Categoria</th><th>Total (R$)</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
  const API = "";
  let token = localStorage.getItem("token") || "";
  let userName = localStorage.getItem("userName") || "";

  const fmt = (n) => Number(n).toLocaleString("pt-BR", { minimumFractionDigits: 2 });

  function headers(withBody = false) {
    const h = { Authorization: `Bearer ${token}` };
    if (withBody) h["Content-Type"] = "application/json";
    return h;
  }

  async function api(method, path, body) {
    const opts = { method, headers: headers(!!body) };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API + path, opts);
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  function showMsg(id, text, isError) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = "msg " + (isError ? "error" : "success");
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", 3000);
  }

  function showTab(name) {
    document.querySelectorAll(".tab").forEach((t, i) => {
      const panels = ["categories", "transactions", "reports"];
      t.classList.toggle("active", panels[i] === name);
    });
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    document.getElementById("panel-" + name).classList.add("active");
    if (name === "transactions") { loadCategoriesForSelect(); loadTransactions(); }
    if (name === "reports") { setCurrentMonth(); }
    if (name === "categories") loadCategories();
  }

  function setCurrentMonth() {
    const now = new Date();
    document.getElementById("report-month").value = now.getMonth() + 1;
    document.getElementById("report-year").value = now.getFullYear();
    document.getElementById("filter-month").value = now.getMonth() + 1;
    document.getElementById("filter-year").value = now.getFullYear();
  }

  function initApp() {
    document.getElementById("auth-section").style.display = "none";
    document.getElementById("app-section").style.display = "block";
    document.getElementById("user-info").textContent = userName;
    document.getElementById("btn-logout").style.display = "inline-block";
    const now = new Date();
    document.getElementById("tx-date").value = now.toISOString().slice(0, 16);
    setCurrentMonth();
    loadCategories();
  }

  function logout() {
    token = ""; userName = "";
    localStorage.removeItem("token"); localStorage.removeItem("userName");
    document.getElementById("auth-section").style.display = "flex";
    document.getElementById("app-section").style.display = "none";
    document.getElementById("btn-logout").style.display = "none";
    document.getElementById("user-info").textContent = "";
  }

  // AUTH
  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("login-email").value,
        password: document.getElementById("login-password").value
      })
    });
    const data = await res.json();
    if (res.ok) {
      token = data.token; userName = data.name || data.email;
      localStorage.setItem("token", token);
      localStorage.setItem("userName", userName);
      initApp();
    } else {
      showMsg("msg-login", data.message || "Erro ao entrar.", true);
    }
  });

  document.getElementById("form-register").addEventListener("submit", async (e) => {
    e.preventDefault();
    const res = await fetch("/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: document.getElementById("reg-name").value,
        email: document.getElementById("reg-email").value,
        password: document.getElementById("reg-password").value
      })
    });
    const data = await res.json();
    if (res.ok) {
      token = data.token; userName = data.name || data.email;
      localStorage.setItem("token", token);
      localStorage.setItem("userName", userName);
      initApp();
    } else {
      showMsg("msg-register", data.message || "Erro ao criar conta.", true);
    }
  });

  // CATEGORIES
  async function loadCategories() {
    const { ok, data } = await api("GET", "/categories");
    if (!ok) return;
    const tbody = document.querySelector("#table-categories tbody");
    tbody.innerHTML = data.length
      ? data.map(c => `<tr><td>${c.name}</td><td><span class="badge badge-${c.kind}">${c.kind === "income" ? "Receita" : "Despesa"}</span></td></tr>`).join("")
      : `<tr><td colspan="2" style="color:#94a3b8;text-align:center;padding:1rem">Nenhuma categoria cadastrada</td></tr>`;
  }

  document.getElementById("form-category").addEventListener("submit", async (e) => {
    e.preventDefault();
    const { ok, data } = await api("POST", "/categories", {
      name: document.getElementById("cat-name").value,
      kind: document.getElementById("cat-kind").value
    });
    if (ok) {
      showMsg("msg-category", "Categoria criada!", false);
      document.getElementById("form-category").reset();
      loadCategories();
    } else {
      showMsg("msg-category", data.message || "Erro.", true);
    }
  });

  async function loadCategoriesForSelect() {
    const { ok, data } = await api("GET", "/categories");
    if (!ok) return;
    const type = document.getElementById("tx-type").value;
    const filtered = data.filter(c => c.kind === type);
    const txSel = document.getElementById("tx-category");
    txSel.innerHTML = filtered.length
      ? filtered.map(c => `<option value="${c.id}">${c.name}</option>`).join("")
      : `<option value="">Nenhuma categoria deste tipo</option>`;
    const filterSel = document.getElementById("filter-category");
    filterSel.innerHTML = `<option value="">Todas</option>` + data.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
  }

  // TRANSACTIONS
  async function loadTransactions() {
    const month = document.getElementById("filter-month").value;
    const year = document.getElementById("filter-year").value;
    const catId = document.getElementById("filter-category").value;
    let qs = "?";
    if (month) qs += `month=${month}&`;
    if (year) qs += `year=${year}&`;
    if (catId) qs += `categoryId=${catId}&`;
    const { ok, data } = await api("GET", "/transactions" + qs);
    if (!ok) return;
    const tbody = document.querySelector("#table-transactions tbody");
    tbody.innerHTML = data.length
      ? data.map(t => `
          <tr>
            <td>${t.description}</td>
            <td><span class="badge badge-${t.type}">${t.type === "income" ? "Receita" : "Despesa"}</span></td>
            <td>R$ ${fmt(t.amount)}</td>
            <td>${t.categoryId}</td>
            <td>${new Date(t.occurredAt).toLocaleDateString("pt-BR")}</td>
            <td>${t.status ? `<span class="badge badge-${t.status}">${t.status === "paid" ? "Pago" : "Pendente"}</span>` : "—"}</td>
            <td>${t.type === "expense" && t.status === "pending"
              ? `<button class="btn btn-sm btn-green" onclick="payExpense('${t.id}')">Pagar</button>`
              : ""
            }</td>
          </tr>`).join("")
      : `<tr><td colspan="7" style="color:#94a3b8;text-align:center;padding:1rem">Nenhum lançamento encontrado</td></tr>`;
  }

  document.getElementById("form-transaction").addEventListener("submit", async (e) => {
    e.preventDefault();
    const { ok, data } = await api("POST", "/transactions", {
      description: document.getElementById("tx-description").value,
      amount: Number(document.getElementById("tx-amount").value),
      type: document.getElementById("tx-type").value,
      categoryId: document.getElementById("tx-category").value,
      occurredAt: new Date(document.getElementById("tx-date").value).toISOString()
    });
    if (ok) {
      showMsg("msg-transaction", "Lançamento registrado!", false);
      document.getElementById("form-transaction").reset();
      document.getElementById("tx-date").value = new Date().toISOString().slice(0, 16);
      loadTransactions();
    } else {
      showMsg("msg-transaction", data.message || "Erro.", true);
    }
  });

  async function payExpense(id) {
    const { ok, data } = await api("PATCH", `/transactions/${id}/pay`, { paidAt: new Date().toISOString() });
    if (ok) loadTransactions();
    else alert(data.message || "Erro ao pagar despesa.");
  }

  // REPORTS
  async function loadReports() {
    const month = document.getElementById("report-month").value;
    const year = document.getElementById("report-year").value;
    const [balRes, sumRes] = await Promise.all([
      api("GET", `/reports/monthly-balance?month=${month}&year=${year}`),
      api("GET", `/reports/category-summary?month=${month}&year=${year}`)
    ]);
    if (balRes.ok) {
      const b = balRes.data;
      document.getElementById("stat-income").textContent = `R$ ${fmt(b.income)}`;
      document.getElementById("stat-expense").textContent = `R$ ${fmt(b.expense)}`;
      const balEl = document.getElementById("stat-balance");
      balEl.textContent = `R$ ${fmt(b.balance)}`;
      balEl.style.color = b.balance >= 0 ? "#059669" : "#dc2626";
    }
    if (sumRes.ok) {
      const tbody = document.querySelector("#table-summary tbody");
      tbody.innerHTML = sumRes.data.length
        ? sumRes.data.map(s => `<tr><td>${s.categoryName}</td><td>R$ ${fmt(s.total)}</td></tr>`).join("")
        : `<tr><td colspan="2" style="color:#94a3b8;text-align:center;padding:1rem">Sem lançamentos no período</td></tr>`;
    }
  }

  // Init
  if (token) initApp();
  else setCurrentMonth();
</script>
</body>
</html>
